#
# Database Configuration PostgreSQL
#
spring.datasource.url=jdbc:postgresql://localhost:5432/dashboarddb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update : Hibernate crée les tables manquantes automatiquement
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL formatées dans le terminal (très utile en cours)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=9000